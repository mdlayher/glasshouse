# Prometheus rejects scrapes or drops series when metrics or labels are
# malformed. This renders each telemetry fixture through the server and
# validates the output with promtool.
name: Prometheus

on:
  push:
    branches: [main]
    paths:
      - 'server/lib/prometheus.js'
      - 'server/lib/telemetry.js'
      - 'scripts/check-prometheus.py'
      - 'test/fixtures/stats-*.json'
      - '.github/workflows/prometheus.yml'
  pull_request:
    paths:
      - 'server/lib/prometheus.js'
      - 'server/lib/telemetry.js'
      - 'scripts/check-prometheus.py'
      - 'test/fixtures/stats-*.json'
      - '.github/workflows/prometheus.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    name: Metric exposition validation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Prometheus metrics exposition
        run: ./scripts/check-prometheus.py
