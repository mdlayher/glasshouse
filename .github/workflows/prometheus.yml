# Prometheus fails scrapes or drops series for exposition text it cannot
# parse or validate. This renders every telemetry fixture through the Prometheus
# exposition formatter and validates it using promtool check metrics.
name: Prometheus

on:
  push:
    branches: [main]
    paths:
      - 'server/lib/prometheus.js'
      - 'server/lib/telemetry.js'
      - 'scripts/check-prometheus.py'
      - 'test/fixtures/stats-*.json'
      - '.github/workflows/prometheus.yml'
  pull_request:
    paths:
      - 'server/lib/prometheus.js'
      - 'server/lib/telemetry.js'
      - 'scripts/check-prometheus.py'
      - 'test/fixtures/stats-*.json'
      - '.github/workflows/prometheus.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    name: Metric exposition validation
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate Prometheus metrics exposition
        run: ./scripts/check-prometheus.py
